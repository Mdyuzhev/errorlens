stages:
  - build
  - deploy

build_backend:
  stage: build
  only: [main]
  script:
    - docker build -t errorlens-backend:latest ./backend
    - docker tag errorlens-backend:latest $STAGE_REGISTRY_PATH/backend:latest || true
  tags: [k8s]

build_frontend:
  stage: build
  only: [main]
  script:
    - docker build -t errorlens-frontend:latest ./dashboard-vue
    - docker tag errorlens-frontend:latest $STAGE_REGISTRY_PATH/frontend:latest || true
  tags: [k8s]

deploy_stage:
  stage: deploy
  only: [main]
  script:
    - kubectl apply -f docs/Stage/namespace.yaml
    - kubectl create secret generic db-secret --from-literal=password=$STAGE_DB_PASSWORD -n errorlens-stage --dry-run=client -o yaml | kubectl apply -f -
    - sed -i "s|your-group|errorlens|g" docs/Stage/*-deployment.yaml
    - kubectl apply -f docs/Stage/
    - kubectl rollout status deployment/errorlens-backend -n errorlens-stage --timeout=120s
    - kubectl rollout status deployment/errorlens-frontend -n errorlens-stage --timeout=120s
  tags: [k8s]
