apiVersion: apps/v1
kind: Deployment
metadata:
  name: errorlens-frontend
  namespace: errorlens-stage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: errorlens-frontend
  template:
    metadata:
      labels:
        app: errorlens-frontend
    spec:
      containers:
      - name: frontend
        image: errorlens-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: errorlens-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 10
