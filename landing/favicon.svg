<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#29B6F6"/>
    </linearGradient>
  </defs>
  <!-- Outer lens ring -->
  <circle cx="42" cy="42" r="35" fill="none" stroke="url(#lensGrad)" stroke-width="8"/>
  <!-- Inner lens -->
  <circle cx="42" cy="42" r="18" fill="url(#lensGrad)" opacity="0.3"/>
  <!-- Lens handle -->
  <line x1="68" y1="68" x2="92" y2="92" stroke="url(#lensGrad)" stroke-width="10" stroke-linecap="round"/>
  <!-- Error indicator dot -->
  <circle cx="75" cy="25" r="12" fill="#F44336"/>
</svg>
