services:
  # FastAPI Backend
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx for landing page + API proxy
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

# =============================================================================
# USAGE:
# =============================================================================
# 1. Set environment variables: GROQ_API_KEY or GEMINI_API_KEY
# 2. Run: docker-compose up --build
# 3. Landing page: http://localhost:3000
# 4. API direct: http://localhost:8000
# 5. API via nginx: http://localhost:3000/api/
# 6. Swagger docs: http://localhost:8000/docs
# =============================================================================
