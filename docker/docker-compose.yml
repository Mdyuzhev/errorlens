services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: errorlens
      POSTGRES_USER: errorlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-errorlens_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errorlens -d errorlens"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-errorlens}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-errorlens_secret}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-errorlens} $${MINIO_ROOT_PASSWORD:-errorlens_secret};
      mc mb --ignore-existing local/article-images;
      mc anonymous set download local/article-images;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-errorlens}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-errorlens_secret}

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ../backend
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://errorlens:${POSTGRES_PASSWORD:-errorlens_secret}@postgres:5432/errorlens
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-errorlens}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-errorlens_secret}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  generator:
    build: ../backend
    command: python -m app.worker.generator_worker
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://errorlens:${POSTGRES_PASSWORD:-errorlens_secret}@postgres:5432/errorlens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "generator_worker"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  notification-worker:
    build: ../backend
    command: python -m app.worker.notification_worker
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://errorlens:${POSTGRES_PASSWORD:-errorlens_secret}@postgres:5432/errorlens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "notification_worker"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  automation-worker:
    build: ../backend
    command: python -m app.worker.automation_worker
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://errorlens:${POSTGRES_PASSWORD:-errorlens_secret}@postgres:5432/errorlens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "automation_worker"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  collab:
    build: ../collab
    ports:
      - "1234:1234"
    environment:
      BACKEND_URL: http://backend:8000
      REDIS_HOST: redis
      PORT: "1234"
    depends_on:
      - redis
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: nginx/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:

# =============================================================================
# USAGE:
# =============================================================================
# cd docker
# docker-compose up --build
#
# Landing page:     http://localhost:3000
# Vue Dashboard:    http://localhost:3000/dashboard/
# API via nginx:    http://localhost:3000/api/
# API direct:       http://localhost:8000
# Swagger docs:     http://localhost:8000/docs
# =============================================================================
