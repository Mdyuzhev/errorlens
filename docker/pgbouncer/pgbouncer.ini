[databases]
errorlens = host=postgres port=5432 dbname=errorlens user=errorlens password=errorlens_secret

[pgbouncer]
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
listen_port = 5432
listen_addr = 0.0.0.0
auth_type = any
server_reset_query = DISCARD ALL
log_connections = 0
log_disconnections = 0
