name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-homelab
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install ruff black isort

      - name: Run ruff (linter)
        run: |
          ruff check backend/app/

      - name: Check black formatting
        continue-on-error: true
        run: |
          black --check backend/app/

      - name: Check isort imports
        continue-on-error: true
        run: |
          isort --check-only backend/app/

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: errorlens_test
          POSTGRES_USER: errorlens
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U errorlens -d errorlens_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://errorlens:test_password@localhost:5432/errorlens_test
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""

  deploy:
    name: Deploy to Homelab
    runs-on: self-hosted
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Pull latest code
        run: |
          cd /opt/errorlens
          git stash --include-untracked || true
          git pull origin main

      - name: Rebuild and restart containers
        run: |
          cd /opt/errorlens/docker
          docker compose up --build -d backend nginx

      - name: Apply database migrations
        run: |
          cd /opt/errorlens/docker
          docker compose exec -T backend alembic upgrade head

      - name: Wait for backend to be healthy
        run: |
          cd /opt/errorlens/docker
          for i in $(seq 1 30); do
            if docker compose exec -T backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "Backend failed to become healthy"
          docker compose logs backend --tail=20
          exit 1

      - name: Verify deployment
        run: |
          curl -sf http://localhost:3000 > /dev/null && echo "Landing: OK"
          curl -sf http://localhost:3000/api/health && echo " API: OK"
