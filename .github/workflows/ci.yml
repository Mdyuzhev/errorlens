name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-homelab
  cancel-in-progress: true

jobs:
  lint:
    name: Lint Python
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install ruff black isort

      - name: Run ruff (linter)
        run: |
          ruff check backend/app/

      - name: Check black formatting
        continue-on-error: true
        run: |
          black --check backend/app/

      - name: Check isort imports
        continue-on-error: true
        run: |
          isort --check-only backend/app/

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: errorlens_test
          POSTGRES_USER: errorlens
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U errorlens -d errorlens_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://errorlens:test_password@localhost:5432/errorlens_test
          REDIS_URL: redis://localhost:6379/0
          GEMINI_API_KEY: ""
          GROQ_API_KEY: ""

  deploy:
    name: Deploy to Homelab
    runs-on: self-hosted
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Pull latest code
        run: |
          cd /opt/errorlens
          git fetch origin main
          git reset --hard origin/main

      - name: Ensure Redis is running
        run: |
          cd /opt/errorlens/docker
          docker compose up -d redis
          docker compose exec -T redis redis-cli ping

      - name: Rebuild and restart backend services
        run: |
          cd /opt/errorlens/docker
          docker compose up --build -d backend generator notification-worker collab

      - name: Apply database migrations
        run: |
          cd /opt/errorlens/docker
          docker compose exec -T backend alembic upgrade head

      - name: Wait for backend to be healthy
        run: |
          cd /opt/errorlens/docker
          for i in $(seq 1 30); do
            if docker compose exec -T backend curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "Backend failed to become healthy"
          docker compose logs backend --tail=20
          exit 1

      - name: Restart nginx (force re-resolve backend DNS)
        run: |
          cd /opt/errorlens/docker
          docker compose up --build --force-recreate -d nginx

      - name: Verify deployment
        run: |
          cd /opt/errorlens/docker
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Landing: OK"
              break
            fi
            echo "Waiting for nginx... ($i/10)"
            sleep 3
          done
          curl -sf http://localhost:3000 > /dev/null || { echo "FAIL: Landing unreachable"; docker compose logs nginx --tail=20; exit 1; }
          echo "Landing: OK"
          for i in $(seq 1 10); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "API: OK"
              break
            fi
            echo "Waiting for API via nginx... ($i/10)"
            sleep 3
          done
          curl -sf http://localhost:3000/api/health || {
            echo "FAIL: API unreachable (502)"
            echo "=== nginx logs ==="
            docker compose logs nginx --tail=20
            echo "=== backend logs ==="
            docker compose logs backend --tail=20
            echo "=== docker ps ==="
            docker compose ps
            exit 1
          }
          echo "API: OK"
          docker compose exec -T redis redis-cli ping && echo "Redis: OK"
          docker compose ps generator --format '{{.State}}' | grep -q running && echo "Generator: OK"
          docker compose ps notification-worker --format '{{.State}}' | grep -q running && echo "Notification Worker: OK"
