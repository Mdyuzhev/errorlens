version: '3.8'

services:
  el-bot:
    build:
      context: .
      dockerfile: Dockerfile.v5
    container_name: el-bot-v5
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - TELEGRAM_ADMIN_ID=${TELEGRAM_ADMIN_ID}
      - GITHUB_REPO=${GITHUB_REPO:-Mdyuzhev/errorlens}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - AGENT_TASKS_DIR=/app/tasks
      - AGENT_MAX_CONCURRENT=3
      - PROJECT_DIR=/app/projects/errorlens
    volumes:
      # Persist tasks between restarts
      - el-bot-tasks:/app/tasks
      # Mount project for Claude agent to work on
      - el-bot-project:/app/projects/errorlens
      # Logs
      - el-bot-logs:/app/logs
    networks:
      - el-bot-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  el-bot-tasks:
  el-bot-project:
  el-bot-logs:

networks:
  el-bot-network:
    driver: bridge
