stages:
  - test_and_upload

test_and_upload:
  stage: test_and_upload
  image: python:3.11-slim
  tags: [docker]
  before_script:
    - apt-get update -q && apt-get install -y zip curl -q
    - pip install -r requirements.txt -q
    - mkdir -p allure-results
  script:
    - pytest --alluredir=allure-results -v || true
    - cd allure-results && zip -r ../allure-results.zip . && cd ..
    - |
      curl -f -X POST "$ERRORLENS_URL/api/v1/launches/upload" \
        -H "Authorization: Bearer $ERRORLENS_TOKEN" \
        -F "file=@allure-results.zip" \
        -F "name=$CI_PROJECT_NAME / $CI_COMMIT_REF_NAME" \
        -F "branch=$CI_COMMIT_REF_NAME" \
        -F "environment=${APP_ENV:-demo}"
  allow_failure: true
