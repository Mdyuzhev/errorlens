stages:
  - test_and_upload

test_and_upload:
  stage: test_and_upload
  image: python:3.11-slim
  tags: [docker]
  variables:
    EL_URL: "$ERRORLENS_URL"
    EL_TOKEN: "$ERRORLENS_TOKEN"
    EL_PROJECT_ID: "$ERRORLENS_PROJECT_ID"
    EL_LAUNCH_NAME: "$CI_PROJECT_NAME / $CI_COMMIT_REF_NAME"
    EL_BRANCH: "$CI_COMMIT_REF_NAME"
    EL_ENVIRONMENT: "${APP_ENV:-demo}"
    EL_PIPELINE_ID: "$CI_PIPELINE_ID"
  before_script:
    - pip install -r requirements.txt -q
  script:
    - pytest -v || true
  allow_failure: true
